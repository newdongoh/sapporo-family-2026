<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍜 2026 삿포로 가족여행 (7/27–7/30)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f1420;
    --panel:#171d2b;
    --panel2:#1e2536;
    --accent:#5eb1ff;
    --accent2:#ffb454;
    --text:#e7ecf5;
    --sub:#9aa5ba;
    --border:#2a3247;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Roboto,"Noto Sans KR",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:20px 24px 14px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#141a29,#0f1420);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.4rem;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:0.9rem;
  }
  .logibar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:14px 24px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .logi-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 12px;
    font-size:0.82rem;
    color:var(--sub);
  }
  .logi-chip{font-size:0.92rem;}
  .logi-chip b{color:var(--text);font-weight:600;}
  .prep{
    max-width:760px;
    margin:0 auto 18px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
  }
  .prep h3{
    margin:0 0 10px;
    font-size:1.05rem;
    color:var(--accent2);
  }
  .prep ul{margin:0;padding-left:18px;}
  .prep li{
    color:var(--sub);
    font-size:0.97rem;
    line-height:1.75;
  }
  .prep li b{color:var(--text);}
  .pick-note{
    background:rgba(255,180,84,0.1);
    border:1px solid var(--accent2);
    border-radius:10px;
    padding:10px 14px;
    font-size:0.95rem;
    color:var(--accent2);
    font-weight:600;
    margin:10px 0;
  }
  .weather-bar{
    display:flex;
    gap:10px;
    padding:0 24px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  .weather-card{
    flex:0 0 auto;
    min-width:92px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 12px;
    text-align:center;
  }
  .weather-card .wd{font-size:0.75rem;color:var(--sub);margin-bottom:2px;}
  .weather-card .wi{font-size:1.4rem;line-height:1.2;}
  .weather-card .wt{font-size:0.8rem;color:var(--text);margin-top:2px;}
  .weather-card .wt .lo{color:var(--sub);}
  .weather-card .wp{font-size:0.7rem;color:var(--accent);margin-top:1px;}
  .weather-card{cursor:pointer;transition:border-color 0.2s, background 0.2s;}
  .weather-card:hover{border-color:var(--accent);}
  .weather-card.active{border-color:var(--accent);background:rgba(94,177,255,0.12);}
  .hourly-panel{
    display:none;
    gap:8px;
    padding:10px 24px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  .hourly-panel.open{display:flex;}
  .hourly-chip{
    flex:0 0 auto;
    min-width:56px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
    text-align:center;
  }
  .hourly-chip .hh{font-size:0.7rem;color:var(--sub);}
  .hourly-chip .hi{font-size:1.1rem;line-height:1.3;}
  .hourly-chip .ht{font-size:0.75rem;color:var(--text);}
  .hourly-chip .hp{font-size:0.65rem;color:var(--accent);}
  #map{
    height:340px;
    width:100%;
  }
  .tabs{
    display:flex;
    gap:8px;
    padding:14px 24px 0;
    background:var(--bg);
    overflow-x:auto;
  }
  .tab{
    flex:0 0 auto;
    padding:10px 18px;
    border-radius:10px 10px 0 0;
    background:var(--panel);
    color:var(--sub);
    cursor:pointer;
    font-weight:600;
    font-size:0.9rem;
    border:1px solid var(--border);
    border-bottom:none;
  }
  .tab.active{
    background:var(--panel2);
    color:var(--accent);
  }
  main{
    max-width:760px;
    margin:0 auto;
    padding:18px 24px 60px;
  }
  .day-header{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .day-header h2{
    margin:0 0 6px;
    font-size:1.15rem;
  }
  .day-header .summary{
    color:var(--sub);
    font-size:0.88rem;
    line-height:1.5;
  }
  .route-link{
    display:inline-block;
    margin-top:10px;
    font-size:0.82rem;
    color:var(--accent);
    text-decoration:none;
    border:1px solid var(--accent);
    border-radius:8px;
    padding:5px 10px;
  }
  .route-link:hover{background:rgba(94,177,255,0.1);}
  .period-label{
    color:var(--accent2);
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:22px 0 10px;
  }
  .card{
    display:flex;
    gap:14px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    scroll-margin-top:16px;
    transition:background 0.3s, border-color 0.3s;
  }
  .card.card-flash{
    background:rgba(94,177,255,0.14);
    border-color:var(--accent);
  }
  .pin-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--accent);
    color:#0b1020;
    font-size:0.68rem;
    font-weight:800;
    margin-right:6px;
    vertical-align:middle;
  }
  .card .time{
    flex:0 0 56px;
    font-weight:700;
    color:var(--accent);
    font-size:0.95rem;
    padding-top:2px;
  }
  .card .icon{
    flex:0 0 28px;
    font-size:1.4rem;
    text-align:center;
  }
  .card .body{flex:1;min-width:0;}
  .card .title{
    font-weight:700;
    font-size:1.08rem;
    margin-bottom:3px;
  }
  .card .meta{
    color:var(--accent2);
    font-size:0.92rem;
    margin-bottom:5px;
  }
  .card .desc{
    color:var(--sub);
    font-size:1rem;
    line-height:1.6;
  }
  .card .links{margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;}
  .card a.maplink, .card a.tellink{
    font-size:0.95rem;
    color:var(--accent);
    text-decoration:none;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 12px;
  }
  .card a.maplink:hover, .card a.tellink:hover{background:rgba(94,177,255,0.12);}
  .note{
    background:var(--panel2);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:0.78rem;
    color:var(--sub);
    margin-top:4px;
  }
  .num-pin{
    display:flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    background:var(--accent);
    border:2px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.45);
  }
  .num-pin span{
    transform:rotate(45deg);
    color:#0b1020;
    font-weight:800;
    font-size:0.78rem;
    font-family:inherit;
  }
  footer{
    text-align:center;
    color:var(--sub);
    font-size:0.8rem;
    padding:20px;
  }
  @media (max-width:520px){
    header, .logibar, .tabs, main{padding-left:14px;padding-right:14px;}
    .prep{margin-left:14px;margin-right:14px;}
    #map{height:260px;}
    .card{padding:14px;gap:10px;}
    .card .time{flex:0 0 48px;font-size:0.92rem;}
    .card .icon{flex:0 0 24px;font-size:1.25rem;}
    .card .title{font-size:1.05rem;}
    .card .desc{font-size:1rem;}
    .card .links{gap:8px;}
    .card a.maplink, .card a.tellink{font-size:0.92rem;padding:7px 10px;}
  }
</style>
</head>

const map = L.map('map', { scrollWheelZoom:false }).setView([43.06, 141.35], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18
}).addTo(map);

let markers = [];
let routeLine = null;
function clearMarkers(){
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if(routeLine){ map.removeLayer(routeLine); routeLine = null; }
}

function mapLinkFor(item){
  if(item.mapUrl) return item.mapUrl;
  if(item.q) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.q)}`;
  if(item.lat && item.lng) return `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
  return null;
}

function renderDay(dayId){
  const day = DAYS.find(d => d.id === dayId);
  clearMarkers();

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', Number(t.dataset.id) === dayId);
  });

  const bounds = [];
  const seen = {};
  let stopNo = 0;
  day.items.forEach((item, idx) => {
    if(item.lat && item.lng){
      stopNo++;
      const key = item.lat.toFixed(4) + ',' + item.lng.toFixed(4);
      const dup = seen[key] || 0;
      seen[key] = dup + 1;
      const lat = item.lat + dup * 0.0006;
      const lng = item.lng + dup * 0.0006;
      const icon = L.divIcon({
        className: '',
        html: `<div class="num-pin"><span>${stopNo}</span></div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 26],
        popupAnchor: [0, -26]
      });
      const marker = L.marker([lat, lng], { icon }).addTo(map);
      marker.bindPopup(`<b>${stopNo}. ${item.title}</b><br>${item.time !== "—" ? item.time + " · " : ""}${item.meta || ""}`);
      const stopId = `stop-${stopNo}`;
      marker.on('click', () => {
        const card = document.getElementById(stopId);
        if(card){
          card.scrollIntoView({ behavior:'smooth', block:'center' });
          card.classList.add('card-flash');
          setTimeout(() => card.classList.remove('card-flash'), 1400);
        }
      });
      markers.push(marker);
      bounds.push([lat, lng]);
    }
  });
  if(bounds.length > 1){
    routeLine = L.polyline(bounds, { color:'#5eb1ff', weight:2, dashArray:'6 8', opacity:0.7 }).addTo(map);
  }
  if(bounds.length){
    map.fitBounds(bounds, { padding:[40,40], maxZoom:14 });
  }

  let routeHtml = "";
  if(day.routeFrom && day.routeTo){
    const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(day.routeFrom)}&destination=${encodeURIComponent(day.routeTo)}&travelmode=driving`;
    routeHtml = `<a class="route-link" href="${url}" target="_blank" rel="noopener">🚗 경로 열기 (차량 이동)</a>`;
  }

  let html = `
    <div class="day-header">
      <h2>${day.title}</h2>
      <div class="summary">${day.summary}</div>
      ${routeHtml}
    </div>
  `;

  let lastPeriod = "";
  let cardStopNo = 0;
  day.items.forEach((item, idx) => {
    if(item.period !== lastPeriod){
      html += `<div class="period-label">${item.period}</div>`;
      lastPeriod = item.period;
    }
    const link = mapLinkFor(item);
    const hasPin = item.lat && item.lng;
    if(hasPin) cardStopNo++;
    const cardId = hasPin ? `id="stop-${cardStopNo}"` : "";
    const pinBadge = hasPin ? `<span class="pin-badge">${cardStopNo}</span>` : "";
    if(item.pickNote){
      html += `<div class="pick-note">${item.pickNote}</div>`;
    }
    html += `
      <div class="card" ${cardId}>
        <div class="time">${item.time}</div>
        <div class="icon">${item.icon}</div>
        <div class="body">
          <div class="title">${pinBadge}${item.title}</div>
          ${item.meta ? `<div class="meta">${item.meta}</div>` : ""}
          <div class="desc">${item.desc}</div>
          ${(link || item.tel) ? `<div class="links">
            ${link ? `<a class="maplink" href="${link}" target="_blank" rel="noopener">📍 지도 열기</a>` : ""}
            ${item.tel ? `<a class="tellink" href="tel:${item.tel.replace(/-/g,'')}">☎ ${item.tel}</a>` : ""}
          </div>` : ""}
        </div>
      </div>
    `;
  });

  document.getElementById('main').innerHTML = html;
}

const tabsEl = document.getElementById('tabs');
DAYS.forEach(day => {
  const btn = document.createElement('div');
  btn.className = 'tab';
  btn.dataset.id = day.id;
  btn.textContent = `${day.label} ${day.date}`;
  btn.addEventListener('click', () => renderDay(day.id));
  tabsEl.appendChild(btn);
});

let HOURLY_DATA = null;
let openWeatherDay = null;

function renderHourlyPanel(dateStr){
  const panel = document.getElementById('hourlyPanel');
  if(!HOURLY_DATA || openWeatherDay === dateStr){
    panel.classList.remove('open');
    panel.innerHTML = '';
    openWeatherDay = null;
    document.querySelectorAll('.weather-card').forEach(c => c.classList.remove('active'));
    return;
  }
  const times = HOURLY_DATA.hourly.time;
  const chips = [];
  times.forEach((t, i) => {
    if(!t.startsWith(dateStr)) return;
    const hour = Number(t.slice(11,13));
    if(hour % 2 !== 0) return; // 2시간 간격으로만 표시
    const code = HOURLY_DATA.hourly.weathercode[i];
    const [icon] = WEATHER_CODES[code] || ["🌡️"];
    const temp = Math.round(HOURLY_DATA.hourly.temperature_2m[i]);
    const pop = HOURLY_DATA.hourly.precipitation_probability[i];
    chips.push(`<div class="hourly-chip">
      <div class="hh">${hour}시</div>
      <div class="hi">${icon}</div>
      <div class="ht">${temp}°</div>
      <div class="hp">☔${pop}%</div>
    </div>`);
  });
  panel.innerHTML = chips.join('');
  panel.classList.add('open');
  openWeatherDay = dateStr;
  document.querySelectorAll('.weather-card').forEach(c => {
    c.classList.toggle('active', c.dataset.date === dateStr);
  });
}

async function loadWeather(){
  const bar = document.getElementById('weatherBar');
  try{
    const url = "https://api.open-meteo.com/v1/forecast?latitude=43.0642&longitude=141.3469"
      + "&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
      + "&hourly=temperature_2m,weathercode,precipitation_probability"
      + "&timezone=Asia%2FTokyo&start_date=2026-07-27&end_date=2026-07-30";
    const res = await fetch(url);
    if(!res.ok) throw new Error("weather fetch failed");
    const data = await res.json();
    HOURLY_DATA = data;
    const days = data.daily.time;
    bar.innerHTML = days.map((d, i) => {
      const code = data.daily.weathercode[i];
      const [icon, desc] = WEATHER_CODES[code] || ["🌡️", "-"];
      const hi = Math.round(data.daily.temperature_2m_max[i]);
      const lo = Math.round(data.daily.temperature_2m_min[i]);
      const pop = data.daily.precipitation_probability_max[i];
      const label = DAYS.find(x => x.date.startsWith(`${d.slice(5,7).replace(/^0/,'')}/${d.slice(8,10).replace(/^0/,'')}`))?.label || d.slice(5);
      return `<div class="weather-card" data-date="${d}">
        <div class="wd">${label} (${d.slice(5).replace('-', '/')})</div>
        <div class="wi">${icon}</div>
        <div class="wt">${hi}° <span class="lo">${lo}°</span></div>
        <div class="wp">☔ ${pop}%</div>
      </div>`;
    }).join("");
    bar.querySelectorAll('.weather-card').forEach(card => {
      card.addEventListener('click', () => renderHourlyPanel(card.dataset.date));
    });
  }catch(e){
    bar.innerHTML = `<div class="weather-card"><div class="wd">삿포로 날씨</div><div class="wi">🌡️</div><div class="wt" style="font-size:0.72rem;color:var(--sub)">예보 준비 전<br>(출발 16일 전부터 제공)</div></div>`;
  }
}
loadWeather();

// 여행 기간 중 접속하면 해당 일차 탭을 자동으로 연다
const TRIP_START = new Date(2026, 6, 27); // 2026-07-27
const today = new Date();
const dayDiff = Math.floor((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - TRIP_START) / 86400000);
renderDay(dayDiff >= 0 && dayDiff <= 3 ? dayDiff + 1 : 1);
</script>
