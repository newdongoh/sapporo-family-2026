<style>
  :root{
    --bg:#0f1420;
    --panel:#171d2b;
    --panel2:#1e2536;
    --accent:#5eb1ff;
    --accent2:#ffb454;
    --text:#e7ecf5;
    --sub:#9aa5ba;
    --border:#2a3247;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Roboto,"Noto Sans KR",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:20px 24px 14px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#141a29,#0f1420);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.4rem;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:0.9rem;
  }
  .logibar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:14px 24px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .logi-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 12px;
    font-size:0.82rem;
    color:var(--sub);
  }
  .logi-chip b{color:var(--text);font-weight:600;}
  #map{
    height:340px;
    width:100%;
  }
  .tabs{
    display:flex;
    gap:8px;
    padding:14px 24px 0;
    background:var(--bg);
    overflow-x:auto;
  }
  .tab{
    flex:0 0 auto;
    padding:10px 18px;
    border-radius:10px 10px 0 0;
    background:var(--panel);
    color:var(--sub);
    cursor:pointer;
    font-weight:600;
    font-size:0.9rem;
    border:1px solid var(--border);
    border-bottom:none;
  }
  .tab.active{
    background:var(--panel2);
    color:var(--accent);
  }
  main{
    max-width:760px;
    margin:0 auto;
    padding:18px 24px 60px;
  }
  .day-header{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .day-header h2{
    margin:0 0 6px;
    font-size:1.15rem;
  }
  .day-header .summary{
    color:var(--sub);
    font-size:0.88rem;
    line-height:1.5;
  }
  .route-link{
    display:inline-block;
    margin-top:10px;
    font-size:0.82rem;
    color:var(--accent);
    text-decoration:none;
    border:1px solid var(--accent);
    border-radius:8px;
    padding:5px 10px;
  }
  .route-link:hover{background:rgba(94,177,255,0.1);}
  .period-label{
    color:var(--accent2);
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:22px 0 10px;
  }
  .card{
    display:flex;
    gap:14px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .card .time{
    flex:0 0 52px;
    font-weight:700;
    color:var(--accent);
    font-size:0.85rem;
    padding-top:2px;
  }
  .card .icon{
    flex:0 0 28px;
    font-size:1.3rem;
    text-align:center;
  }
  .card .body{flex:1;min-width:0;}
  .card .title{
    font-weight:700;
    font-size:0.98rem;
    margin-bottom:2px;
  }
  .card .meta{
    color:var(--accent2);
    font-size:0.78rem;
    margin-bottom:4px;
  }
  .card .desc{
    color:var(--sub);
    font-size:0.85rem;
    line-height:1.5;
  }
  .card .links{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;}
  .card a.maplink{
    font-size:0.78rem;
    color:var(--accent);
    text-decoration:none;
  }
  .card a.maplink:hover{text-decoration:underline;}
  .note{
    background:var(--panel2);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:0.78rem;
    color:var(--sub);
    margin-top:4px;
  }
  footer{
    text-align:center;
    color:var(--sub);
    font-size:0.75rem;
    padding:20px;
  }
</style>
</head>

  if(item.mapUrl) return item.mapUrl;
  if(item.q) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.q)}`;
  if(item.lat && item.lng) return `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
  return null;
}

function renderDay(dayId){
  const day = DAYS.find(d => d.id === dayId);
  clearMarkers();

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', Number(t.dataset.id) === dayId);
  });

  const bounds = [];
  day.items.forEach((item, idx) => {
    if(item.lat && item.lng){
      const marker = L.marker([item.lat, item.lng]).addTo(map);
      marker.bindPopup(`<b>${idx+1}. ${item.title}</b><br>${item.time !== "—" ? item.time + " · " : ""}${item.meta || ""}`);
      markers.push(marker);
      bounds.push([item.lat, item.lng]);
    }
  });
  if(bounds.length){
    map.fitBounds(bounds, { padding:[40,40], maxZoom:14 });
  }

  let routeHtml = "";
  if(day.routeFrom && day.routeTo){
    const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(day.routeFrom)}&destination=${encodeURIComponent(day.routeTo)}&travelmode=driving`;
    routeHtml = `<a class="route-link" href="${url}" target="_blank" rel="noopener">🚗 경로 열기 (차량 이동)</a>`;
  }

  let html = `
    <div class="day-header">
      <h2>${day.title}</h2>
      <div class="summary">${day.summary}</div>
      ${routeHtml}
    </div>
  `;

  let lastPeriod = "";
  day.items.forEach((item, idx) => {
    if(item.period !== lastPeriod){
      html += `<div class="period-label">${item.period}</div>`;
      lastPeriod = item.period;
    }
    const link = mapLinkFor(item);
    html += `
      <div class="card">
        <div class="time">${item.time}</div>
        <div class="icon">${item.icon}</div>
        <div class="body">
          <div class="title">${item.title}</div>
          ${item.meta ? `<div class="meta">${item.meta}</div>` : ""}
          <div class="desc">${item.desc}</div>
          ${link ? `<div class="links"><a class="maplink" href="${link}" target="_blank" rel="noopener">📍 구글맵 내비 열기</a></div>` : ""}
        </div>
      </div>
    `;
  });

  document.getElementById('main').innerHTML = html;
}

const tabsEl = document.getElementById('tabs');
DAYS.forEach(day => {
  const btn = document.createElement('div');
  btn.className = 'tab';
  btn.dataset.id = day.id;
  btn.textContent = `${day.label} ${day.date}`;
  btn.addEventListener('click', () => renderDay(day.id));
  tabsEl.appendChild(btn);
});

renderDay(1);
</script>

</body>
</html>
